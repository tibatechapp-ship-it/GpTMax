name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, do not use this template. Follow SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
  - type: input
    id: abi
    attributes:
      label: ABI / backend / model (if relevant)
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, prompts, personal data, and private file paths.
