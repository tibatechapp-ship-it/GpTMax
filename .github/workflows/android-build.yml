name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Assemble and unit test (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install pinned Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.9"

      - name: Compile and run native Unicode conversion tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I app/src/main/cpp \
            tests/native/unicode_conversion_test.cpp \
            -o /tmp/gptmax-unicode-tests
          /tmp/gptmax-unicode-tests
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I app/src/main/cpp \
            tests/native/generation_budget_test.cpp \
            -o /tmp/gptmax-generation-budget-tests
          /tmp/gptmax-generation-budget-tests

      - name: Build debug APK and run unit tests
        run: gradle --no-daemon assembleDebug testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gptmax-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
