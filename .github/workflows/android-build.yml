name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Assemble, lint and unit test (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install pinned Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.9"

      - name: Compile and run native Unicode conversion tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I app/src/main/cpp \
            tests/native/unicode_conversion_test.cpp \
            -o /tmp/gptmax-unicode-tests
          /tmp/gptmax-unicode-tests
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I app/src/main/cpp \
            tests/native/generation_budget_test.cpp \
            -o /tmp/gptmax-generation-budget-tests
          /tmp/gptmax-generation-budget-tests

      - name: Build debug APK and run unit tests
        run: gradle --no-daemon assembleDebug testDebugUnitTest

      # Fix #4 gate 1: static analysis must pass, not only compilation.
      - name: Lint gate
        run: gradle --no-daemon lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gptmax-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release build gate (R8, unsigned)
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install pinned Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.9"

      # Fix #4 gate 2: the minified release path (R8 + proguard) must build.
      - name: Assemble unsigned release APK
        run: gradle --no-daemon assembleRelease

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gptmax-release-apk-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  device:
    name: On-device inference gate (emulator)
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.9"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", OWNER="root", GROUP="kvm", MODE="0666", TAG+="systemd"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot headless emulator
        run: |
          set -e
          echo "no" | avdmanager create avd --force --name ci-device \
            --package "system-images;android-35;google_apis;x86_64" --device pixel
          "$ANDROID_HOME/emulator/emulator" -avd ci-device \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -accel on &
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
          adb shell getprop ro.product.cpu.abi

      # Fix #4 gate 3: guardrails verified on a real Android runtime with the
      # packaged native engine (DeviceSmokeTest). The ABI override matches
      # app/build.gradle.kts — hosted emulators run on x86_64 hosts.
      - name: Run instrumented device tests
        run: gradle --no-daemon connectedDebugAndroidTest -Pgptmax.abiFilters=arm64-v8a,x86_64

      - name: Upload device test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-gate-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
