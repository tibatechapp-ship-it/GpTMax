# Android build — proposed upgraded workflow (review fix #4)
#
# GitHub integration token lacks the `workflows` permission, so this file is
# staged here for a maintainer to apply with:
#
#   mv docs/ci/android-build.yml .github/workflows/android-build.yml
#   git add .github/workflows/android-build.yml && git commit -m "CI: add lint/release/emulator gates"
#
# Gates added on top of the previous workflow:
#   1. lintDebug           — static analysis must pass
#   2. release job         — assembleRelease proves R8/ProGuard rules survive every PR
#   3. device job          — arm64-v8a emulator runs connectedDebugAndroidTest
#                            (DeviceSmokeTest: guardrails + ABI verification)

name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Assemble, lint and unit test (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install pinned Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.9"

      - name: Compile and run native Unicode conversion tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I app/src/main/cpp \
            tests/native/unicode_conversion_test.cpp \
            -o /tmp/gptmax-unicode-tests
          /tmp/gptmax-unicode-tests
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I app/src/main/cpp \
            tests/native/generation_budget_test.cpp \
            -o /tmp/gptmax-generation-budget-tests
          /tmp/gptmax-generation-budget-tests

      - name: Build debug APK, run unit tests and lint
        run: gradle --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gptmax-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gptmax-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release gate (unsigned release build)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install pinned Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.9"

      - name: Assemble release (R8 + ProGuard must pass)
        run: gradle --no-daemon assembleRelease

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gptmax-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  device:
    name: Emulator smoke + guardrail gate (arm64)
    needs: android
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install pinned Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.9"

      # The app ships arm64-v8a only, so the emulator gate runs on the
      # Apple-silicon runner with an arm64-v8a system image (no KVM needed).
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_apis
          script: gradle --no-daemon connectedDebugAndroidTest
