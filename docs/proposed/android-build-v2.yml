# Proposed replacement for .github/workflows/android-build.yml (review finding #4).
#
# The GitHub App integration used for automated pushes cannot modify files under
# .github/workflows/ (it lacks the `workflow` permission). Copy this file to
# .github/workflows/android-build.yml to activate the new gates:
#
#   git mv: replace the existing workflow with this content on the fix/agent-safety branch.
#
# Changes versus the current workflow:
#   1. Gradle wrapper validation (generates the wrapper and runs ./gradlew --version).
#   2. lintDebug as a soft gate (continue-on-error until the warning baseline is triaged)
#      with the report uploaded as an artifact.
#   3. Unsigned release APK build + upload.
#   4. On-device inference tests remain a documented follow-up (M2 in the development
#      plan): they require an emulator and a bundled GGUF test model.

name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, lint, and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install pinned Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.9"

      - name: Validate Gradle wrapper
        run: |
          gradle --no-daemon wrapper --gradle-version "8.9"
          chmod +x gradlew
          ./gradlew --no-daemon --version

      - name: Compile and run native Unicode conversion tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I app/src/main/cpp \
            tests/native/unicode_conversion_test.cpp \
            -o /tmp/gptmax-unicode-tests
          /tmp/gptmax-unicode-tests
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I app/src/main/cpp \
            tests/native/generation_budget_test.cpp \
            -o /tmp/gptmax-generation-budget-tests
          /tmp/gptmax-generation-budget-tests

      - name: Build debug APK and run unit tests
        run: gradle --no-daemon assembleDebug testDebugUnitTest

      - name: Run Android lint
        continue-on-error: true  # soft gate until the existing warning baseline is triaged
        run: gradle --no-daemon lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gptmax-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Build release APK (unsigned)
        run: gradle --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gptmax-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gptmax-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
